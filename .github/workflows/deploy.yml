name: deploy

# Runs after CI goes green on main, or on demand.
#
#   1. build-and-push  build every image, push it tagged with the commit SHA, sign the pushed
#                      digest keylessly with cosign (OIDC, no stored key), and Trivy-scan it.
#   2. infra           terraform apply. Terraform owns infrastructure, not image versions: the
#                      Cloud Run modules ignore image changes after creation, so on the very
#                      first apply it creates services from this commit's images and afterwards
#                      only converges config.
#   3. rollout         move every stateless service and job to this commit's image (no public
#                      traffic worth canarying: ingestor, MCP, jobs).
#   4. canary          the public API gets a 0%-traffic revision, a smoke check on its own
#                      revision URL, then the cutover; the website follows once the API it
#                      calls is live.
#
# Requires infra/terraform/bootstrap applied and these repository variables: GCP_PROJECT_ID,
# GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA, GCP_STATE_BUCKET,
# GCP_ARTIFACT_REGISTRY (see infra/terraform/README.md).

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for Workload Identity Federation and keyless cosign signing

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never interrupt an in-flight apply

env:
  TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

# Actions are pinned to full commit SHAs (tag in trailing comment), same discipline as ci.yml.

jobs:
  build-and-push:
    # Skipped (not failed) until the GCP repository variables exist; every later job needs this one.
    if: >-
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: prod
    # No job outputs on purpose: a matrix job's outputs come from whichever leg finishes last,
    # so per-image digests would be overwritten. Later jobs reference the immutable SHA tag.
    strategy:
      matrix:
        image:
          - { name: edge, context: ., dockerfile: apps/edge-go/Dockerfile }
          - { name: indexer, context: ., dockerfile: apps/indexer/Dockerfile }
          - { name: api, context: ., dockerfile: apps/api/Dockerfile }
          - { name: mcp, context: ., dockerfile: apps/mcp/Dockerfile }
          - { name: web, context: apps/web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token # required for the registry login below
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-${{ matrix.image.name }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed digest (keyless, OIDC)
        run: cosign sign --yes "${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  infra:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      - name: Init
        working-directory: infra/terraform/environments/prod
        run: terraform init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
      - name: Apply
        working-directory: infra/terraform/environments/prod
        env:
          REG: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          terraform apply -auto-approve -input=false \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "edge_image=$REG/xm-edge:$TAG" \
            -var "indexer_image=$REG/xm-indexer:$TAG" \
            -var "api_image=$REG/xm-api:$TAG" \
            -var "mcp_image=$REG/xm-mcp:$TAG" \
            -var "web_image=$REG/xm-web:$TAG"

  rollout:
    needs: infra
    runs-on: ubuntu-24.04
    environment: prod
    env:
      REG: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      # gcloud reads these instead of per-command --project/--region/--quiet flags.
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Services and jobs without public traffic to canary
        run: |
          # Only the image changes; env, secrets, scaling and IAM stay as Terraform set them.
          gcloud run deploy xm-ingestor --image "$REG/xm-edge:$TAG"
          gcloud run deploy xm-mcp --image "$REG/xm-mcp:$TAG"
          gcloud run jobs update xm-poller --image "$REG/xm-edge:$TAG"
          gcloud run jobs update xm-poller-problems --image "$REG/xm-edge:$TAG"
          gcloud run jobs update xm-indexer --image "$REG/xm-indexer:$TAG"

  canary:
    needs: rollout
    runs-on: ubuntu-24.04
    environment: prod
    env:
      REG: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      # gcloud reads these instead of per-command --project/--region/--quiet flags.
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: API revision at 0% traffic
        id: revision
        run: |
          gcloud run deploy xm-api --image "$REG/xm-api:$TAG" --no-traffic --tag canary
          url=$(gcloud run services describe xm-api --format=json \
            | jq -r '.status.traffic[] | select(.tag == "canary") | .url')
          test -n "$url" || { echo "no canary URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke-check the canary (readiness + a real problems query)
        env:
          URL: ${{ steps.revision.outputs.url }}
        run: |
          for _ in $(seq 1 12); do
            if curl -sf "$URL/readyz" >/dev/null && curl -sf "$URL/v1/problems?limit=1" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "canary never became ready"; exit 1
      - name: Cut API traffic over
        run: gcloud run services update-traffic xm-api --to-latest
      - name: Website, after the API it calls
        run: gcloud run deploy xm-web --image "$REG/xm-web:$TAG"
