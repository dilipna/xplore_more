name: deploy

# Runs only after CI has gone green on main, or on demand. Builds each service image, signs it
# keylessly with cosign (OIDC, no stored key), pushes to Artifact Registry, applies Terraform
# with the new image digests, then canaries the public API specifically: a fresh revision is
# deployed at 0% traffic, smoke-checked on its own per-revision URL, and only then cut over to
# 100%. Everything else -- the ingestor, the two Cloud Run jobs (poller, poller-problems,
# indexer), and the MCP server (thin and stateless, embeds nothing, has no warm-up cost) --
# has no meaningful canary risk, so Terraform's own rolling update is enough for them.
#
# Requires infra/terraform/bootstrap to have been applied (see infra/terraform/README.md) and
# these repository variables set from its outputs: GCP_PROJECT_ID, GCP_REGION,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SA, GCP_STATE_BUCKET, GCP_ARTIFACT_REGISTRY.
# Unwritten and unrun until that infra exists (tracked in CONTINUE_SESSION.md §7).

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for both Workload Identity Federation and keyless cosign signing

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never interrupt an in-flight apply

# Actions are pinned to full commit SHAs (tag in trailing comment), verified via the GitHub API
# tags endpoint, same discipline as ci.yml. Renovate proposes updates.

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: prod
    outputs:
      edge: ${{ steps.digest-edge.outputs.digest }}
      indexer: ${{ steps.digest-indexer.outputs.digest }}
      api: ${{ steps.digest-api.outputs.digest }}
      mcp: ${{ steps.digest-mcp.outputs.digest }}
    strategy:
      matrix:
        image:
          - { name: edge, dockerfile: apps/edge-go/Dockerfile }
          - { name: indexer, dockerfile: apps/indexer/Dockerfile }
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: mcp, dockerfile: apps/mcp/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed digest (keyless, OIDC)
        run: cosign sign --yes "${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - id: digest-edge
        if: matrix.image.name == 'edge'
        run: echo "digest=${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-edge@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: digest-indexer
        if: matrix.image.name == 'indexer'
        run: echo "digest=${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-indexer@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: digest-api
        if: matrix.image.name == 'api'
        run: echo "digest=${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-api@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: digest-mcp
        if: matrix.image.name == 'mcp'
        run: echo "digest=${{ vars.GCP_ARTIFACT_REGISTRY }}/xm-mcp@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      - name: Init
        working-directory: infra/terraform/environments/prod
        run: terraform init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
      - name: Apply
        working-directory: infra/terraform/environments/prod
        # The API's traffic is cut over separately below, once its canary revision is verified,
        # so this apply targets everything else it touches (the service, IAM) but not traffic.
        run: |
          terraform apply -auto-approve \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "edge_image=${{ needs.build-and-push.outputs.edge }}" \
            -var "indexer_image=${{ needs.build-and-push.outputs.indexer }}" \
            -var "api_image=${{ needs.build-and-push.outputs.api }}" \
            -var "mcp_image=${{ needs.build-and-push.outputs.mcp }}"

  canary-api:
    needs: [build-and-push, terraform-apply]
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy the new revision with zero traffic
        id: revision
        run: |
          gcloud run deploy xm-api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --image "${{ needs.build-and-push.outputs.api }}" \
            --no-traffic --tag canary
          url=$(gcloud run services describe xm-api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.traffic[0].url)' --filter 'status.traffic.tag=canary' 2>/dev/null || true)
          if [ -z "$url" ]; then
            url="https://canary---xm-api-$(gcloud run services describe xm-api --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)' | sed -E 's#https://xm-api-##')"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke check the canary revision
        run: |
          for _ in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.revision.outputs.url }}/readyz") || code=000
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "canary revision never became ready (last status: $code)"; exit 1
      - name: Cut traffic over to the new revision
        run: |
          gcloud run services update-traffic xm-api \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --to-latest
