# Local development and integration-test dependencies.
# Mirrors production protocols: Postgres+pgvector (Neon), Redis (Upstash), Pub/Sub (emulator).
name: xploremore

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: xm
      POSTGRES_PASSWORD: xm
      POSTGRES_DB: xploremore
    # Host port is overridable when 5432 is already taken by another project's Postgres:
    #   XM_PG_PORT=5433 docker compose ... up -d   (then point XM_DATABASE_URL/XM_TEST_DATABASE_URL at it)
    ports: ["${XM_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xm -d xploremore"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=xm-local
    ports: ["8085:8085"]

  # --- Pipeline services (profile: pipeline) ---
  ingestor:
    profiles: ["pipeline"]
    build:
      context: ../..
      dockerfile: apps/edge-go/Dockerfile
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      XM_GCP_PROJECT: xm-local
      XM_TEXT_DIR: /tmp/text
      XM_STATE_FILE: /tmp/poller-state.json
    ports: ["8080:8080"]
    depends_on: [pubsub]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
