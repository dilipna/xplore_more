[project]
name = "xm-search"
version = "0.1.0"
description = "Story search: query understanding, lexical + dense candidates, RRF fusion, story collapse."
requires-python = ">=3.13,<3.14"
dependencies = [
    "xm-core",
    "xm-cluster",
    "xm-rank",
    "numpy>=2.1",
]

[tool.uv.sources]
xm-core = { workspace = true }
xm-cluster = { workspace = true }
xm-rank = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
