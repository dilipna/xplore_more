[project]
name = "xm-api"
version = "0.1.0"
description = "Public read API: story search, ranked feed, story detail."
requires-python = ">=3.13,<3.14"
dependencies = [
    "xm-core",
    "xm-cluster",
    "xm-embed",
    "xm-search",
    "xm-rank",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "xm-problems",
]

[project.scripts]
xm-api = "xm_api.__main__:main"

[tool.uv.sources]
xm-core = { workspace = true }
xm-cluster = { workspace = true }
xm-embed = { workspace = true }
xm-search = { workspace = true }
xm-rank = { workspace = true }
xm-problems = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
