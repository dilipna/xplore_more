[project]
name = "xm-mcp"
version = "0.1.0"
description = "MCP server (streamable HTTP) exposing XploreMore problems and stories to agents."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
    "mcp>=1.20",
]

[project.scripts]
xm-mcp = "xm_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
