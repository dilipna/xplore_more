# Tech entity gazetteer used for story clustering and ranking features.
#
# Why a gazetteer rather than a general NER model: tech news is dominated by a
# long-but-enumerable set of organizations, products, models and projects whose surface
# forms are ambiguous to generic NER ("Llama", "Gemini", "Go", "Rust"). A curated alias list
# is precise, fast (no model in the hot path) and auditable. Generic NER can be layered on
# later for unknown entities (tracked as a gap in docs/clustering.md).
#
# Aliases are matched case-insensitively on word boundaries, except where `case_sensitive`
# is true (short or common-word aliases like "Go", "Rust", "Arc").

entities:
