# Source registry. Verify reachability with: scripts/go.sh run ./cmd/poller --check
#
# authority: prior belief (0-1) that a story covered by this source matters. These are
#   hand-set PRIORS for cold start only; the importance model learns from realized
#   outcomes and ADR-0008 documents how priors are replaced.
# max_items: cap per poll, protects free-tier budgets from high-volume feeds (arXiv).
# kind: rss (RSS/Atom/JSON Feed) | hn (Hacker News API)
# category: primary (labs, companies, projects, papers: the people who made the news)
#   | press | independent (researchers and newsletters) | community (aggregators).
#   Shown as a badge on the website; apps/web/src/lib/sources.ts mirrors it (drift-tested).

sources:
  # --- AI labs & research orgs ---
  - {id: openai-news, kind: rss, name: OpenAI News, url: "https://openai.com/news/rss.xml", authority: 0.95, category: primary}
  - {id: google-deepmind, kind: rss, name: Google DeepMind Blog, url: "https://deepmind.google/blog/rss.xml", authority: 0.95, category: primary}
  - {id: google-research, kind: rss, name: Google Research Blog, url: "https://research.google/blog/rss/", authority: 0.9, category: primary}
  - {id: microsoft-research, kind: rss, name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/", authority: 0.85, category: primary}
  - {id: huggingface-blog, kind: rss, name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", authority: 0.85, category: primary}
  - {id: nvidia-developer, kind: rss, name: NVIDIA Technical Blog, url: "https://developer.nvidia.com/blog/feed", authority: 0.8, category: primary}
  - {id: aws-ml-blog, kind: rss, name: AWS Machine Learning Blog, url: "https://aws.amazon.com/blogs/machine-learning/feed/", authority: 0.7, category: primary}

  # --- Technology press ---
