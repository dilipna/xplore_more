  - {id: meta-engineering, kind: rss, name: Engineering at Meta, url: "https://engineering.fb.com/feed/", authority: 0.8, category: primary}
  - {id: google-cloud-blog, kind: rss, name: Google Cloud Blog, url: "https://cloudblog.withgoogle.com/rss/", authority: 0.7, category: primary}
