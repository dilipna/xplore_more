  - {id: venturebeat-ai, kind: rss, name: VentureBeat AI, url: "https://venturebeat.com/category/ai/feed/", authority: 0.65, category: press}
  - {id: mit-tech-review, kind: rss, name: MIT Technology Review, url: "https://www.technologyreview.com/feed/", authority: 0.85, category: press}
  - {id: the-register, kind: rss, name: The Register, url: "https://www.theregister.com/headlines.atom", authority: 0.65, category: press}
